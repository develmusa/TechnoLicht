ledfx:
  # Audio configuration
  audio:
    source: "default"
    sample_rate: 48000
    buffer_size: 1024
    device_index: 0

  # Web server
  host: "0.0.0.0"
  port: 8888

  # Devices
  devices:
    - name: "QuinLED"
      type: "wled"
      config:
        ip_address: "192.168.100.100"
        port: 21324
        pixel_count: 1333
        segments:
          - name: "Strip-1"
            start: 0
            end: 333
            output: 0
          - name: "Strip-2"
            start: 334
            end: 666
            output: 1
          - name: "Strip-3"
            start: 667
            end: 999
            output: 2
          - name: "Strip-4"
            start: 1000
            end: 1332
            output: 3

  # Effects (adjust in UI)
  effects: {}

  # Scenes (adjust in UI)
  scenes: {}
