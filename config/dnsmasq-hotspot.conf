# DHCP + DNS for WiFi Hotspot (AP mode)
# wlan0 is the access point interface
interface=wlan0
bind-interfaces

# DHCP pool for DJ laptop / other clients
dhcp-range=192.168.50.10,192.168.50.200,255.255.255.0,24h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1

# Friendly DNS aliases — DJ can type these in the browser
address=/ledfx.local/192.168.50.1
address=/quinled.local/192.168.100.100

# Local-only resolver (no upstream internet)
no-resolv
no-poll
local=/local/
domain=local

# Logging
log-queries
log-dhcp
